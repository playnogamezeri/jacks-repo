name: Build Toon Jack Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - "app/**"
      - "*.gradle.kts"
      - "gradle.properties"
      - ".github/workflows/android-apk.yml"

permissions:
  contents: read

concurrency:
  group: toon-jack-android-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
      - name: Install Android platform and build tools
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      # A GitHub Actions cache is only an optimization and can be evicted.
      # The signing keystore must live in repository Actions secrets instead.
      - name: Load permanent Toon Jack signing key
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.TOONJACK_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.TOONJACK_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.TOONJACK_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.TOONJACK_KEY_PASSWORD }}
          EXPECTED_CERT_SHA256: ${{ secrets.TOONJACK_SIGNING_CERT_SHA256 }}
        run: |
          set -euo pipefail
          for name in KEYSTORE_BASE64 STORE_PASSWORD KEY_ALIAS KEY_PASSWORD EXPECTED_CERT_SHA256; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing GitHub Actions secret: TOONJACK_${name}. Configure all five TOONJACK signing secrets before building."
              exit 1
            fi
          done
          KEYSTORE_PATH="$RUNNER_TEMP/toonjack-signing.keystore"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          test -s "$KEYSTORE_PATH"
          ACTUAL_CERT_SHA256="$(keytool -exportcert -keystore "$KEYSTORE_PATH" -storepass "$STORE_PASSWORD" -alias "$KEY_ALIAS" 2>/dev/null | sha256sum | awk '{print $1}')"
          EXPECTED_CERT_SHA256="$(printf '%s' "$EXPECTED_CERT_SHA256" | tr '[:upper:]' '[:lower:]' | tr -d ':[:space:]')"
          echo "Signing certificate SHA-256: $ACTUAL_CERT_SHA256"
          if [ "$ACTUAL_CERT_SHA256" != "$EXPECTED_CERT_SHA256" ]; then
            echo "::error::Signing keystore fingerprint does not match TOONJACK_SIGNING_CERT_SHA256. Build stopped to prevent an un-installable update."
            exit 1
          fi
          {
            echo "TOONJACK_KEYSTORE_PATH=$KEYSTORE_PATH"
            echo "TOONJACK_STORE_PASSWORD=$STORE_PASSWORD"
            echo "TOONJACK_KEY_ALIAS=$KEY_ALIAS"
            echo "TOONJACK_KEY_PASSWORD=$KEY_PASSWORD"
            echo "TOONJACK_SIGNING_CERT_SHA256=$ACTUAL_CERT_SHA256"
          } >> "$GITHUB_ENV"

      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug
      - name: Verify APK signature
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "$APK" | grep -F "Signer #1 certificate SHA-256 digest: $TOONJACK_SIGNING_CERT_SHA256"
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: toon-jack-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
