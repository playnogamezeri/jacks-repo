name: Build Toon Jack Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - "app/**"
      - "*.gradle.kts"
      - "gradle.properties"
      - ".github/workflows/android-apk.yml"

permissions:
  contents: read

concurrency:
  group: toon-jack-android-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
      - name: Install Android platform and build tools
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Restore persistent debug signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: toon-jack-debug-signing-key-v1
      - name: Verify persistent signing key
        shell: bash
        run: |
          set -euo pipefail
          test -f "$HOME/.android/debug.keystore" || {
            echo "::error::Persistent Toon Jack signing key is missing; refusing to generate a replacement."
            exit 1
          }
          ACTUAL="$(keytool -exportcert -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey 2>/dev/null | sha256sum | awk '{print $1}')"
          EXPECTED="ff9927feb87599c8c1882ce95c92fc6b1b52c5d7348622ff453002af673f6031"
          echo "Signing certificate SHA-256: $ACTUAL"
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "::error::Signing key does not match the currently installed Toon Jack 1.1.1 app. No APK will be published."
            exit 1
          fi
      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug
      - name: Verify APK signature
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs app/build/outputs/apk/debug/app-debug.apk | grep -F "Signer #1 certificate SHA-256 digest: ff9927feb87599c8c1882ce95c92fc6b1b52c5d7348622ff453002af673f6031"
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: toon-jack-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
