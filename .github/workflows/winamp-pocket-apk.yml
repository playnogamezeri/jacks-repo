name: Build Winamp Pocket APK
on:
  push:
    paths:
      - 'WinampPocket/**'
      - '.github/workflows/winamp-pocket-apk.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android platform
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Build debug APK
        run: gradle -p WinampPocket assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: winamp-pocket-debug-apk
          path: WinampPocket/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
