plugins { id 'com.android.application' }

android {
    namespace 'com.jackgray.winamp'
    compileSdk 35
    signingConfigs {
        debugStable {
            storeFile file(System.getProperty('user.home') + '/.android/debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debugStable
        }
    }
    defaultConfig {
        applicationId 'com.jackgray.winamp'
        minSdk 23
        targetSdk 35
        versionCode 21
        versionName '1.5.0'
    }
}

